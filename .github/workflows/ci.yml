name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Detect Cargo project
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet - skipping cargo steps (bootstrap scaffolding)."
          fi

      - name: Show toolchain
        if: steps.detect.outputs.cargo == 'true'
        run: |
          rustc --version
          cargo --version

      # Coverage backend (R8 / A2 / C2). Installed on BOTH matrix legs —
      # ubuntu-latest and windows-latest — because mutate4rust gates mutation on
      # `cargo-llvm-cov` coverage and a missing backend is a hard exit-1, never a
      # silent mutate-everything. `llvm-tools-preview` supplies llvm-profdata /
      # llvm-cov, which cargo-llvm-cov shells out to.
      - name: Add llvm-tools-preview
        if: steps.detect.outputs.cargo == 'true'
        run: rustup component add llvm-tools-preview

      # taiki-e/install-action fetches a prebuilt cargo-llvm-cov for both Linux
      # and Windows; it is the install path cargo-llvm-cov's own README
      # prescribes, and avoids a ~5-minute `cargo install` rebuild per leg.
      - name: Install cargo-llvm-cov
        if: steps.detect.outputs.cargo == 'true'
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov

      - name: Verify coverage backend
        if: steps.detect.outputs.cargo == 'true'
        run: cargo llvm-cov --version

      - name: Build
        if: steps.detect.outputs.cargo == 'true'
        run: cargo build --all-targets --verbose

      - name: Test
        if: steps.detect.outputs.cargo == 'true'
        run: cargo test --verbose

  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Detect Cargo project
        id: detect
        run: |
          if [ -f Cargo.toml ]; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet - skipping lint (bootstrap scaffolding)."
          fi

      - name: Add rustfmt + clippy
        if: steps.detect.outputs.cargo == 'true'
        run: rustup component add rustfmt clippy

      - name: Check formatting
        if: steps.detect.outputs.cargo == 'true'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.detect.outputs.cargo == 'true'
        run: cargo clippy --all-targets -- -D warnings