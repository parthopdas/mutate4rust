[package]
name = "mutate4rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.4", features = ["full", "extra-traits", "visit"] }
toml = "1.1.4"
